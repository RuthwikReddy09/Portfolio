<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="uofm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#003087"/>
      <stop offset="100%" stop-color="#001f5b"/>
    </linearGradient>
  </defs>

  <!-- Shield shape -->
  <path d="M10,10 H110 V70 Q110,110 60,118 Q10,110 10,70 Z" fill="url(#uofm-bg)"/>
  <path d="M10,10 H110 V70 Q110,110 60,118 Q10,110 10,70 Z" fill="none" stroke="#4a90d9" stroke-width="2" opacity="0.4"/>

  <!-- Inner shield border -->
  <path d="M18,18 H102 V70 Q102,104 60,112 Q18,104 18,70 Z" fill="none" stroke="#4a90d9" stroke-width="1" opacity="0.3"/>

  <!-- "U of M" text -->
  <text x="60" y="55" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="white" letter-spacing="1">U of M</text>

  <!-- Divider line -->
  <line x1="28" y1="62" x2="92" y2="62" stroke="#4a90d9" stroke-width="1" opacity="0.6"/>

  <!-- "MEMPHIS" text -->
  <text x="60" y="80" text-anchor="middle" font-family="Georgia,serif" font-size="11" font-weight="400" fill="#a8c4e8" letter-spacing="2">MEMPHIS</text>

  <!-- Stars / decorative dots -->
  <circle cx="30" cy="38" r="2" fill="#4a90d9" opacity="0.5"/>
  <circle cx="90" cy="38" r="2" fill="#4a90d9" opacity="0.5"/>
</svg>
