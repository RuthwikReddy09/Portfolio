<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rul-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0a00"/>
      <stop offset="100%" stop-color="#1a1000"/>
    </linearGradient>
    <linearGradient id="rul-degradation" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="rul-predicted" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="rul-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rul-acc" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="rul-glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rul-softglow">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#rul-bg)"/>

  <!-- Subtle hex grid background -->
  <g opacity="0.04" stroke="#f97316" stroke-width="0.5" fill="none">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="60" y1="0" x2="60" y2="500"/>
    <line x1="120" y1="0" x2="120" y2="500"/>
    <line x1="180" y1="0" x2="180" y2="500"/>
    <line x1="240" y1="0" x2="240" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="360" y1="0" x2="360" y2="500"/>
    <line x1="420" y1="0" x2="420" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="540" y1="0" x2="540" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="660" y1="0" x2="660" y2="500"/>
    <line x1="720" y1="0" x2="720" y2="500"/>
  </g>

  <!-- Ambient glow -->
  <ellipse cx="450" cy="280" rx="280" ry="100" fill="#f97316" opacity="0.04" filter="url(#rul-softglow)"/>

  <!-- Gear icon top-left -->
  <g transform="translate(36,28)" opacity="0.8">
    <circle cx="16" cy="16" r="8" fill="none" stroke="#f97316" stroke-width="2"/>
    <circle cx="16" cy="16" r="3.5" fill="#f97316"/>
    <g stroke="#f97316" stroke-width="2.5" stroke-linecap="round">
      <line x1="16" y1="4" x2="16" y2="1"/>
      <line x1="16" y1="28" x2="16" y2="31"/>
      <line x1="4" y1="16" x2="1" y2="16"/>
      <line x1="28" y1="16" x2="31" y2="16"/>
      <line x1="7.5" y1="7.5" x2="5.4" y2="5.4"/>
      <line x1="24.5" y1="24.5" x2="26.6" y2="26.6"/>
      <line x1="24.5" y1="7.5" x2="26.6" y2="5.4"/>
      <line x1="7.5" y1="24.5" x2="5.4" y2="26.6"/>
    </g>
  </g>

  <!-- Title -->
  <text x="76" y="42" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#fef3c7">Predictive Maintenance &amp; RUL Analysis</text>
  <text x="76" y="58" font-family="system-ui,sans-serif" font-size="9" fill="#6b7280">Remaining Useful Life Prediction · Sensor Data · ML</text>

  <!-- Main chart panel -->
  <rect x="30" y="75" width="510" height="285" rx="12" fill="#0f0d00" stroke="#2d2000" stroke-width="1.5"/>
  <text x="46" y="97" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#fef3c7">Health Index &amp; RUL Prediction Over Time</text>

  <!-- Chart area Y labels -->
  <g font-family="monospace" font-size="8" fill="#4b5563">
    <text x="34" y="340">0%</text>
    <text x="34" y="310">25%</text>
    <text x="34" y="280">50%</text>
    <text x="34" y="250">75%</text>
    <text x="34" y="220">100%</text>
  </g>

  <!-- Chart gridlines -->
  <g stroke="#1c1800" stroke-width="0.8">
    <line x1="60" y1="340" x2="520" y2="340"/>
    <line x1="60" y1="310" x2="520" y2="310"/>
    <line x1="60" y1="280" x2="520" y2="280"/>
    <line x1="60" y1="250" x2="520" y2="250"/>
    <line x1="60" y1="220" x2="520" y2="220"/>
  </g>

  <!-- Actual health degradation curve (going down left to right) -->
  <path d="M62,218 C100,219 130,221 160,225 C200,230 230,238 270,252 C310,268 340,283 380,300 C410,313 440,325 480,334 C500,337 512,339 520,340"
    stroke="url(#rul-degradation)" stroke-width="2.5" fill="none" opacity="0.95"/>

  <!-- Fill under degradation curve -->
  <path d="M62,218 C100,219 130,221 160,225 C200,230 230,238 270,252 C310,268 340,283 380,300 C410,313 440,325 480,334 C500,337 512,339 520,340 L520,340 L62,340Z"
    fill="url(#rul-fill)" opacity="0.4"/>

  <!-- Predicted RUL line (blue, dashed, from ~midpoint going further) -->
  <path d="M270,252 C310,262 350,276 390,294 C420,308 450,320 490,332 C505,337 515,340 520,340"
    stroke="url(#rul-predicted)" stroke-width="2" fill="none" stroke-dasharray="6,4" opacity="0.85"/>

  <!-- "Now" vertical marker -->
  <line x1="270" y1="108" x2="270" y2="345" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>
  <rect x="255" y="108" width="30" height="16" rx="4" fill="#1c1400" stroke="#eab308" stroke-width="1"/>
  <text x="270" y="120" text-anchor="middle" font-family="monospace" font-size="8" fill="#eab308">NOW</text>

  <!-- RUL Remaining annotation -->
  <line x1="270" y1="175" x2="520" y2="175" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="390" y="170" text-anchor="middle" font-family="monospace" font-size="8" fill="#38bdf8">RUL = 248 cycles</text>

  <!-- Warning threshold line -->
  <line x1="62" y1="318" x2="520" y2="318" stroke="#ef4444" stroke-width="1" stroke-dasharray="5,4" opacity="0.5"/>
  <text x="68" y="314" font-family="monospace" font-size="7" fill="#ef4444">threshold</text>

  <!-- Data points on actual curve -->
  <g fill="#fbbf24" opacity="0.9">
    <circle cx="62" cy="218" r="3"/>
    <circle cx="120" cy="221" r="3"/>
    <circle cx="180" cy="227" r="3"/>
    <circle cx="240" cy="244" r="3"/>
    <circle cx="270" cy="252" r="4" filter="url(#rul-glow)"/>
  </g>

  <!-- X axis labels -->
  <g font-family="monospace" font-size="8" fill="#4b5563" text-anchor="middle">
    <text x="62" y="356">0</text>
    <text x="162" y="356">100</text>
    <text x="262" y="356">200</text>
    <text x="362" y="356">300</text>
    <text x="462" y="356">400</text>
  </g>
  <text x="290" y="370" font-family="system-ui,sans-serif" font-size="8" fill="#6b7280">Operating Cycles</text>

  <!-- Legend -->
  <line x1="62" y1="350" x2="82" y2="350" stroke="url(#rul-degradation)" stroke-width="2"/>
  <text x="86" y="354" font-family="monospace" font-size="8" fill="#94a3b8">Actual Health</text>
  <line x1="160" y1="350" x2="180" y2="350" stroke="url(#rul-predicted)" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="184" y="354" font-family="monospace" font-size="8" fill="#94a3b8">Predicted RUL</text>

  <!-- Accuracy improvement panel -->
  <rect x="550" y="75" width="220" height="180" rx="12" fill="#0f0d00" stroke="#2d2000" stroke-width="1.5"/>
  <text x="566" y="97" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#fef3c7">Model Performance</text>

  <!-- Accuracy bars: Before vs After -->
  <text x="566" y="120" font-family="monospace" font-size="8" fill="#6b7280">Accuracy</text>
  <!-- Before bar -->
  <rect x="566" y="128" width="145" height="20" rx="4" fill="#1c1400"/>
  <rect x="566" y="128" width="105" height="20" rx="4" fill="#4b5563" opacity="0.7"/>
  <text x="675" y="142" font-family="monospace" font-size="9" fill="#9ca3af">72%</text>
  <text x="566" y="162" font-family="monospace" font-size="8" fill="#6b7280">Before</text>

  <!-- After bar -->
  <rect x="566" y="168" width="145" height="20" rx="4" fill="#1c1400"/>
  <rect x="566" y="168" width="120" height="20" rx="4" fill="#22c55e" opacity="0.8" filter="url(#rul-glow)"/>
  <text x="690" y="182" font-family="monospace" font-size="9" fill="#4ade80">83%</text>
  <text x="566" y="202" font-family="monospace" font-size="8" fill="#6b7280">After (5-fold CV)</text>

  <!-- Delta badge -->
  <rect x="566" y="215" width="90" height="26" rx="13" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="611" y="232" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#4ade80">+11%</text>
  <text x="660" y="232" font-family="monospace" font-size="9" fill="#6b7280">accuracy</text>

  <!-- Feature importance mini panel -->
  <rect x="550" y="265" width="220" height="95" rx="12" fill="#0f0d00" stroke="#2d2000" stroke-width="1.5"/>
  <text x="566" y="285" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#fef3c7">Top Sensor Features</text>

  <!-- Feature bars -->
  <g font-family="monospace" font-size="8">
    <text x="566" y="303" fill="#94a3b8">Vibration</text>
    <rect x="620" y="294" width="120" height="10" rx="3" fill="#1c1400"/>
    <rect x="620" y="294" width="108" height="10" rx="3" fill="#f97316" opacity="0.8"/>
    <text x="732" y="303" fill="#fb923c">90%</text>

    <text x="566" y="320" fill="#94a3b8">Temperature</text>
    <rect x="620" y="311" width="120" height="10" rx="3" fill="#1c1400"/>
    <rect x="620" y="311" width="84" height="10" rx="3" fill="#eab308" opacity="0.8"/>
    <text x="732" y="320" fill="#fbbf24">70%</text>

    <text x="566" y="337" fill="#94a3b8">Pressure</text>
    <rect x="620" y="328" width="120" height="10" rx="3" fill="#1c1400"/>
    <rect x="620" y="328" width="66" height="10" rx="3" fill="#22c55e" opacity="0.8"/>
    <text x="732" y="337" fill="#4ade80">55%</text>

    <text x="566" y="354" fill="#94a3b8">RPM</text>
    <rect x="620" y="345" width="120" height="10" rx="3" fill="#1c1400"/>
    <rect x="620" y="345" width="48" height="10" rx="3" fill="#38bdf8" opacity="0.8"/>
    <text x="732" y="354" fill="#7dd3fc">40%</text>
  </g>

  <!-- Alert badge bottom left -->
  <rect x="30" y="375" width="510" height="50" rx="12" fill="#0f0d00" stroke="#2d2000" stroke-width="1"/>
  <circle cx="55" cy="400" r="10" fill="#ef4444" opacity="0.2"/>
  <circle cx="55" cy="400" r="6" fill="#ef4444" opacity="0.8" filter="url(#rul-glow)"/>
  <text x="72" y="395" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#fca5a5">Maintenance Alert</text>
  <text x="72" y="410" font-family="monospace" font-size="9" fill="#6b7280">Engine #7 · RUL: 12 cycles remaining · Schedule inspection</text>
  <!-- Time remaining bar -->
  <rect x="350" y="389" width="175" height="12" rx="6" fill="#1c1400"/>
  <rect x="350" y="389" width="21" height="12" rx="6" fill="#ef4444" opacity="0.9"/>
  <text x="530" y="400" font-family="monospace" font-size="8" fill="#ef4444">12%</text>

  <!-- Tech tags -->
  <rect x="30" y="440" width="50" height="20" rx="10" fill="#0f0d00" stroke="#f97316" stroke-width="1"/>
  <text x="55" y="454" text-anchor="middle" font-family="monospace" font-size="9" fill="#fdba74">Python</text>
  <rect x="88" y="440" width="42" height="20" rx="10" fill="#0f0d00" stroke="#eab308" stroke-width="1"/>
  <text x="109" y="454" text-anchor="middle" font-family="monospace" font-size="9" fill="#fbbf24">SQL</text>
  <rect x="138" y="440" width="56" height="20" rx="10" fill="#0f0d00" stroke="#22c55e" stroke-width="1"/>
  <text x="166" y="454" text-anchor="middle" font-family="monospace" font-size="9" fill="#86efac">SQLite</text>
  <rect x="202" y="440" width="60" height="20" rx="10" fill="#0f0d00" stroke="#38bdf8" stroke-width="1"/>
  <text x="232" y="454" text-anchor="middle" font-family="monospace" font-size="9" fill="#7dd3fc">Power BI</text>
  <rect x="270" y="440" width="76" height="20" rx="10" fill="#0f0d00" stroke="#818cf8" stroke-width="1"/>
  <text x="308" y="454" text-anchor="middle" font-family="monospace" font-size="9" fill="#a5b4fc">Scikit-learn</text>
</svg>
