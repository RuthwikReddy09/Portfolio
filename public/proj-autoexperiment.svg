<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ae-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#120828"/>
    </linearGradient>
    <linearGradient id="ae-node1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="ae-node2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ae-node3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="ae-node4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="ae-center" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2d1b69"/>
    </linearGradient>
    <linearGradient id="ae-chart" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="ae-glow1">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ae-glow2">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ae-softglow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ae-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1" opacity="0.9"/>
    </marker>
    <marker id="ae-arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8b5cf6" opacity="0.9"/>
    </marker>
    <marker id="ae-arrow3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#06b6d4" opacity="0.9"/>
    </marker>
    <marker id="ae-arrow4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981" opacity="0.9"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#ae-bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.06" stroke="#818cf8" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="80" y1="0" x2="80" y2="500"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="240" y1="0" x2="240" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="560" y1="0" x2="560" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
    <line x1="720" y1="0" x2="720" y2="500"/>
  </g>

  <!-- Ambient glow center -->
  <ellipse cx="400" cy="250" rx="180" ry="160" fill="#6366f1" opacity="0.04" filter="url(#ae-softglow)"/>

  <!-- Curved arrows between nodes (drawn behind nodes) -->
  <!-- Observer (top, 400,100) → Planner (right, 600,250) -->
  <path d="M 448,118 Q 560,140 582,222" stroke="#6366f1" stroke-width="2" fill="none" opacity="0.8" stroke-dasharray="6,3" marker-end="url(#ae-arrow)"/>
  <!-- Planner (600,250) → Executor (bottom, 400,400) -->
  <path d="M 582,278 Q 560,360 448,382" stroke="#8b5cf6" stroke-width="2" fill="none" opacity="0.8" stroke-dasharray="6,3" marker-end="url(#ae-arrow2)"/>
  <!-- Executor (bottom, 400,400) → Evaluator (left, 200,250) -->
  <path d="M 352,382 Q 240,360 218,278" stroke="#06b6d4" stroke-width="2" fill="none" opacity="0.8" stroke-dasharray="6,3" marker-end="url(#ae-arrow3)"/>
  <!-- Evaluator (left, 200,250) → Observer (top, 400,100) -->
  <path d="M 218,222 Q 240,140 352,118" stroke="#10b981" stroke-width="2" fill="none" opacity="0.8" stroke-dasharray="6,3" marker-end="url(#ae-arrow4)"/>

  <!-- Center hub -->
  <circle cx="400" cy="250" r="72" fill="url(#ae-center)" stroke="#6366f1" stroke-width="1.5" opacity="0.9"/>
  <circle cx="400" cy="250" r="72" fill="none" stroke="#818cf8" stroke-width="0.5" opacity="0.4"/>
  <!-- Rotating dashes on center ring -->
  <circle cx="400" cy="250" r="80" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="4,8" opacity="0.3"/>

  <!-- Center icon: neural net nodes -->
  <circle cx="370" cy="235" r="5" fill="#818cf8" opacity="0.9"/>
  <circle cx="400" cy="225" r="5" fill="#818cf8" opacity="0.9"/>
  <circle cx="430" cy="235" r="5" fill="#818cf8" opacity="0.9"/>
  <circle cx="380" cy="258" r="5" fill="#a5b4fc" opacity="0.9"/>
  <circle cx="420" cy="258" r="5" fill="#a5b4fc" opacity="0.9"/>
  <circle cx="400" cy="278" r="5" fill="#c7d2fe" opacity="0.9"/>
  <line x1="370" y1="235" x2="380" y2="258" stroke="#818cf8" stroke-width="1" opacity="0.6"/>
  <line x1="370" y1="235" x2="420" y2="258" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
  <line x1="400" y1="225" x2="380" y2="258" stroke="#818cf8" stroke-width="1" opacity="0.6"/>
  <line x1="400" y1="225" x2="420" y2="258" stroke="#818cf8" stroke-width="1" opacity="0.6"/>
  <line x1="430" y1="235" x2="380" y2="258" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
  <line x1="430" y1="235" x2="420" y2="258" stroke="#818cf8" stroke-width="1" opacity="0.6"/>
  <line x1="380" y1="258" x2="400" y2="278" stroke="#a5b4fc" stroke-width="1" opacity="0.6"/>
  <line x1="420" y1="258" x2="400" y2="278" stroke="#a5b4fc" stroke-width="1" opacity="0.6"/>

  <!-- Center label -->
  <text x="400" y="305" text-anchor="middle" font-family="monospace" font-size="9" fill="#a5b4fc" opacity="0.8">ML TRAINING</text>

  <!-- Node: Observer (top) -->
  <circle cx="400" cy="100" r="42" fill="#0f0f24" stroke="#6366f1" stroke-width="2" filter="url(#ae-glow1)"/>
  <circle cx="400" cy="100" r="42" fill="url(#ae-node1)" opacity="0.15"/>
  <!-- Eye icon -->
  <ellipse cx="400" cy="98" rx="14" ry="9" fill="none" stroke="#818cf8" stroke-width="1.5"/>
  <circle cx="400" cy="98" r="5" fill="#6366f1" opacity="0.9"/>
  <circle cx="400" cy="98" r="2.5" fill="#c7d2fe"/>
  <line x1="388" y1="106" x2="395" y2="110" stroke="#6366f1" stroke-width="1.2" opacity="0.7"/>
  <line x1="412" y1="106" x2="405" y2="110" stroke="#6366f1" stroke-width="1.2" opacity="0.7"/>
  <text x="400" y="126" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#a5b4fc">Observer</text>

  <!-- Node: Planner (right) -->
  <circle cx="600" cy="250" r="42" fill="#0f0f24" stroke="#8b5cf6" stroke-width="2" filter="url(#ae-glow1)"/>
  <circle cx="600" cy="250" r="42" fill="url(#ae-node2)" opacity="0.15"/>
  <!-- Brain-like squiggle -->
  <path d="M590,242 Q583,235 590,230 Q598,225 600,232 Q602,225 610,230 Q617,235 610,242 Q618,248 612,256 Q606,262 600,258 Q594,262 588,256 Q582,248 590,242Z" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="600" y1="258" x2="600" y2="264" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="600" y="276" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#c4b5fd">Planner</text>

  <!-- Node: Executor (bottom) -->
  <circle cx="400" cy="400" r="42" fill="#0f0f24" stroke="#06b6d4" stroke-width="2" filter="url(#ae-glow1)"/>
  <circle cx="400" cy="400" r="42" fill="url(#ae-node3)" opacity="0.15"/>
  <!-- Gear icon -->
  <circle cx="400" cy="398" r="9" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
  <circle cx="400" cy="398" r="4" fill="#06b6d4" opacity="0.8"/>
  <g stroke="#22d3ee" stroke-width="2" stroke-linecap="round">
    <line x1="400" y1="385" x2="400" y2="382"/>
    <line x1="400" y1="411" x2="400" y2="414"/>
    <line x1="387" y1="398" x2="384" y2="398"/>
    <line x1="413" y1="398" x2="416" y2="398"/>
    <line x1="391" y1="389" x2="389" y2="387"/>
    <line x1="409" y1="407" x2="411" y2="409"/>
    <line x1="409" y1="389" x2="411" y2="387"/>
    <line x1="391" y1="407" x2="389" y2="409"/>
  </g>
  <text x="400" y="424" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#67e8f9">Executor</text>

  <!-- Node: Evaluator (left) -->
  <circle cx="200" cy="250" r="42" fill="#0f0f24" stroke="#10b981" stroke-width="2" filter="url(#ae-glow1)"/>
  <circle cx="200" cy="250" r="42" fill="url(#ae-node4)" opacity="0.15"/>
  <!-- Chart bars icon -->
  <rect x="186" y="255" width="6" height="10" fill="#10b981" opacity="0.9" rx="1"/>
  <rect x="196" y="246" width="6" height="19" fill="#34d399" opacity="0.9" rx="1"/>
  <rect x="206" y="239" width="6" height="26" fill="#6ee7b7" opacity="0.9" rx="1"/>
  <line x1="183" y1="265" x2="216" y2="265" stroke="#10b981" stroke-width="1" opacity="0.6"/>
  <text x="200" y="276" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#6ee7b7">Evaluator</text>

  <!-- Stats panel bottom-right -->
  <rect x="580" y="370" width="195" height="105" rx="12" fill="#0d0d20" stroke="#6366f1" stroke-width="1" opacity="0.85"/>
  <text x="596" y="390" font-family="monospace" font-size="9" fill="#818cf8" opacity="0.7">METRICS</text>
  <text x="596" y="410" font-family="monospace" font-size="11" fill="#a5b4fc">+6.8%</text>
  <text x="648" y="410" font-family="monospace" font-size="9" fill="#6b7280">accuracy</text>
  <text x="596" y="428" font-family="monospace" font-size="11" fill="#34d399">−45%</text>
  <text x="645" y="428" font-family="monospace" font-size="9" fill="#6b7280">failed runs</text>
  <text x="596" y="446" font-family="monospace" font-size="11" fill="#67e8f9">−60%</text>
  <text x="643" y="446" font-family="monospace" font-size="9" fill="#6b7280">debug time</text>
  <!-- Mini accuracy chart -->
  <polyline points="596,465 612,463 625,460 638,455 650,450 663,445 676,440 689,434 700,429 713,423 726,417 739,411 752,406 765,401 775,396" stroke="#6366f1" stroke-width="1.5" fill="none" opacity="0.8"/>
  <path d="M596,470 L596,465 612,463 625,460 638,455 650,450 663,445 676,440 689,434 700,429 713,423 726,417 739,411 752,406 765,401 775,396 775,470Z" fill="url(#ae-chart)" opacity="0.4"/>

  <!-- Title top-left -->
  <text x="30" y="38" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#e0e7ff">AutoExperiment</text>
  <text x="30" y="56" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">Autonomous ML Debugging &amp; Optimization Agent</text>

  <!-- Tech tags -->
  <rect x="30" y="440" width="58" height="20" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="59" y="454" text-anchor="middle" font-family="monospace" font-size="9" fill="#a5b4fc">PyTorch</text>
  <rect x="96" y="440" width="66" height="20" rx="10" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="129" y="454" text-anchor="middle" font-family="monospace" font-size="9" fill="#c4b5fd">LangGraph</text>
  <rect x="170" y="440" width="48" height="20" rx="10" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1"/>
  <text x="194" y="454" text-anchor="middle" font-family="monospace" font-size="9" fill="#67e8f9">MLflow</text>
  <rect x="226" y="440" width="48" height="20" rx="10" fill="#1e1b4b" stroke="#10b981" stroke-width="1"/>
  <text x="250" y="454" text-anchor="middle" font-family="monospace" font-size="9" fill="#6ee7b7">Optuna</text>

  <!-- Subtle particle dots -->
  <circle cx="90" cy="180" r="1.5" fill="#6366f1" opacity="0.5"/>
  <circle cx="140" cy="340" r="1.5" fill="#8b5cf6" opacity="0.4"/>
  <circle cx="660" cy="130" r="1.5" fill="#06b6d4" opacity="0.5"/>
  <circle cx="710" cy="310" r="1.5" fill="#10b981" opacity="0.4"/>
  <circle cx="520" cy="70" r="1" fill="#818cf8" opacity="0.5"/>
  <circle cx="60" cy="420" r="1" fill="#a78bfa" opacity="0.4"/>
  <circle cx="750" cy="200" r="1.5" fill="#22d3ee" opacity="0.4"/>
  <circle cx="340" cy="460" r="1" fill="#6366f1" opacity="0.4"/>
</svg>
